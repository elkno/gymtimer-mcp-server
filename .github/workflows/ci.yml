name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # --ignore-scripts skips the "prepare" build so the explicit step below
      # is what reports a type error, with readable output.
      - run: npm ci --ignore-scripts
      - run: npm run build
